<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>第三方评论导入</title>
  <style>
    :root{color-scheme:light dark;font:15px/1.55 system-ui,-apple-system,sans-serif}body{margin:0;background:#f5f6f8;color:#202124}.wrap{max-width:820px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:28px;box-shadow:0 8px 28px #0000000a}h1{margin:0 0 6px;font-size:26px}.muted{color:#6b7280;margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:600;margin-bottom:7px}select,input,textarea,button{font:inherit}select,input[type=file],textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:inherit}textarea{min-height:92px;resize:vertical}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:22px}button{border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:#e5e7eb;color:#111827}button.primary{background:#2563eb;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.result{display:none;margin-top:22px;padding:16px;border-radius:8px;background:#f3f4f6;white-space:pre-wrap}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.warning{color:#92400e}code{font-size:13px}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:20px}.wide{grid-column:auto}}@media(prefers-color-scheme:dark){body{background:#111827;color:#e5e7eb}.card{background:#1f2937;border-color:#374151}.muted{color:#9ca3af}select,input[type=file],textarea{background:#111827;border-color:#4b5563}.result{background:#111827}}
  </style>
</head>
<body>
<main class="wrap"><section class="card">
  <h1>第三方评论导入</h1>
  <p class="muted">先预览匹配结果，再写入 Firekylin。重复导入会自动跳过相同评论。</p>
  <div class="grid">
    <div><label for="platform">来源系统</label><select id="platform"><option>Valine</option><option>Waline</option><option>Twikoo</option><option>Artalk</option><option>Gitalk</option><option>Giscus</option><option>Commento</option></select></div>
    <div><label for="file">JSON 导出文件</label><input id="file" type="file" accept=".json,.jsonl,application/json"></div>
    <div class="wide"><label for="mapping">URL → 文章 ID 手动映射（可选 JSON）</label><textarea id="mapping" placeholder='{"https://example.com/old-post": 123}'></textarea></div>
    <div class="wide"><label><input id="approve" type="checkbox"> 将所有导入评论设为已通过（否则保留来源审核状态）</label></div>
  </div>
  <div class="actions"><button id="preview">预览</button><button id="import" class="primary" disabled>确认导入</button></div>
  <div id="result" class="result"></div>
</section></main>
<script>
(() => {
  const csrfToken = "__CSRF_TOKEN__";
  const byId = id => document.getElementById(id);
  const result = byId('result');
  let source = '';
  let previewed = false;
  function show(message, type) { result.style.display = 'block'; result.className = `result ${type || ''}`; result.textContent = message; }
  function payload() {
    let urlMap = {};
    const mapping = byId('mapping').value.trim();
    if (mapping) urlMap = JSON.parse(mapping);
    return {platform: byId('platform').value.toLowerCase(), source, urlMap, status: byId('approve').checked ? 'approved' : 'preserve'};
  }
  async function call(action) {
    const response = await fetch(`/api/plugins/comment-import/${action}`, {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken}, body: JSON.stringify(payload())});
    const body = await response.json().catch(() => ({}));
    if (!response.ok || body.errno) throw new Error(body.errmsg || body.message || `请求失败 (${response.status})`);
    return body.data;
  }
  byId('file').addEventListener('change', async event => { source = event.target.files[0] ? await event.target.files[0].text() : ''; previewed = false; byId('import').disabled = true; });
  byId('preview').addEventListener('click', async () => {
    if (!source) return show('请先选择 JSON 导出文件。', 'error');
    try {
      show('正在解析并匹配文章…');
      const data = await call('preview');
      previewed = true; byId('import').disabled = data.matched === 0;
      const missing = data.unmatchedPages.length ? `\n\n未匹配页面（最多显示 100 项）：\n${data.unmatchedPages.join('\n')}` : '';
      show(`共解析 ${data.total} 条评论 / ${data.pages} 个页面\n已匹配 ${data.matched} 条 / ${data.matchedPages} 个页面\n未匹配 ${data.unmatched} 条${missing}`, data.unmatched ? 'warning' : 'ok');
    } catch (error) { show(error.message, 'error'); }
  });
  byId('import').addEventListener('click', async () => {
    if (!previewed || !confirm('确认将已匹配评论写入 Firekylin？')) return;
    try {
      byId('import').disabled = true; show('正在导入，请勿关闭页面…');
      const data = await call('import');
      show(`导入完成：新增 ${data.imported} 条，跳过重复 ${data.duplicates} 条，未匹配 ${data.unmatched} 条。`, 'ok');
    } catch (error) { byId('import').disabled = false; show(error.message, 'error'); }
  });
})();
</script>
</body>
</html>
